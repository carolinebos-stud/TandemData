name: Post JSON File to Two URLs

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  post_json:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Send Humidity to Tandem
        run: |
          curl -X POST "https://:JAqnj1XiQs2lWrZmS16WFg@tandem.autodesk.com/api/v1/timeseries/models/urn:adsk.dtm:4ogcPbkuSw-SepL4eC-crg/streams/AQAAAO7_W_rI2k5hoXokBO6qy2QAAAAA" \
          -H "Content-Type: application/json" \
          -d @humidity.json

      - name: Send Temperature to Tandem
        run: |
          curl -X POST "https://:bLN234VZTq6cmwkteOXxCg@tandem.autodesk.com/api/v1/timeseries/models/urn:adsk.dtm:4ogcPbkuSw-SepL4eC-crg/streams/AQAAAM1Xgln95kS0oDv6ZcVbrjsAAAAA" \
          -H "Content-Type: application/json" \
          -d @temperature.json


          echo Add other actions to build,
          echo test, and deploy your project.
